# Prod infra: EMQX (MQTT) -> Kafka (buffer 20-60K RPS) -> MinIO (Bronze) + ClickHouse + Superset.
# Dev/test chạy local DuckDB, không cần compose. Dùng compose này khi triển khai GĐ1/GĐ3.
services:
  emqx:
    image: emqx/emqx:5.8
    ports: ["1883:1883", "18083:18083"]
  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123", "9002:9000"]
  superset:
    image: apache/superset:4.0
    ports: ["8088:8088"]
    depends_on: [clickhouse]
